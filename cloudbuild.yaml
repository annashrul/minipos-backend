# Cloud Build pipeline — optimized untuk sub-60s incremental builds.
# Strategi:
# 1. docker buildx with registry cache (no full image pull)
# 2. build + push dalam 1 step
# 3. min-instances=1 → revision swap tanpa cold start

substitutions:
  _REGION: "asia-southeast2"
  _SERVICE: "pos-api"
  _REPO: "pos-api"
  _RUNTIME_SA: "pos-api-sa@pos-offline-116b6.iam.gserviceaccount.com"
  _CORS_ORIGINS: "http://localhost:3000,https://*.vercel.app"

steps:
  # ── Build + Push dengan registry cache (single step, parallel push)
  - id: build-push
    name: "gcr.io/cloud-builders/docker"
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        IMAGE="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api"

        # Setup buildx (BuildKit) builder once.
        docker buildx create --name fast --driver docker-container --use --bootstrap

        # Build dengan cache pulled on-demand dari registry,
        # sekaligus push final image + cache layer.
        docker buildx build \
          --cache-from type=registry,ref=$$IMAGE:buildcache \
          --cache-to type=registry,ref=$$IMAGE:buildcache,mode=max \
          --tag $$IMAGE:${SHORT_SHA} \
          --tag $$IMAGE:latest \
          --push \
          .

  # ── Deploy ke Cloud Run (min-instances=1 supaya zero cold-start swap)
  - id: deploy
    name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "${_SERVICE}"
      - "--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:${SHORT_SHA}"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--port=8080"
      - "--memory=512Mi"
      - "--cpu=1"
      - "--min-instances=1"
      - "--max-instances=10"
      - "--concurrency=80"
      - "--timeout=60"
      - "--execution-environment=gen2"
      - "--cpu-boost"
      - "--service-account=${_RUNTIME_SA}"
      # PENTING: jangan set PORT — itu reserved env Cloud Run, auto ke 8080.
      # Set PORT manual akan bikin deploy gagal.
      - "--set-env-vars=^@^NODE_ENV=production@JWT_EXPIRES_IN=1h@JWT_REFRESH_EXPIRES_IN=7d@CORS_ORIGINS=${_CORS_ORIGINS}@WEB_ORIGIN=https://menopos.vercel.app@XENDIT_API_BASE=https://api.xendit.co@XENDIT_INVOICE_DURATION=900@XENDIT_QR_DURATION=900@XENDIT_VA_DURATION=86400@XENDIT_DEV_AUTO_SUCCESS=true@XENDIT_DEV_AUTO_SUCCESS_DELAY_MS=2000@XENDIT_CALLBACK_SUCCESS_URL=https://menopos.vercel.app/payment/success@XENDIT_CALLBACK_FAILURE_URL=https://menopos.vercel.app/payment/failure"
      - "--set-secrets=DATABASE_URL=database-url:latest,DIRECT_URL=direct-url:latest,JWT_SECRET=jwt-secret:latest,CLOUDINARY_URL=cloudinary-url:latest,RESEND_API_KEY=resend-api-key:latest,PUSHER_APP_ID=pusher-app-id:latest,PUSHER_KEY=pusher-key:latest,PUSHER_SECRET=pusher-secret:latest,PUSHER_CLUSTER=pusher-cluster:latest,XENDIT_SECRET_KEY=xendit-secret-key:latest,XENDIT_WEBHOOK_TOKEN=xendit-webhook-token:latest,GROQ_API_KEY=groq-api-key:latest,REDIS_URL=redis-url:latest"

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: false

timeout: 1200s
