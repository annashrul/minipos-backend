## render.yaml — Blueprint deployment MiniPOS Backend ke Render
## Docs: https://render.com/docs/blueprint-spec
##
## Cara deploy:
## 1. Push repo ini ke GitHub
## 2. Buka render.com → New → Blueprint
## 3. Pilih repo ini, Render akan otomatis membaca file ini

services:
  - type: web
    name: menopos-api
    runtime: docker
    ## Root repo = folder backend, Dockerfile ada di root repo
    dockerfilePath: ./Dockerfile
    dockerContext: .

    ## Render inject PORT secara otomatis (default 10000 di Render)
    ## src/main.ts sudah baca process.env.PORT, jadi tidak perlu ubah kode.

    ## Plan: "starter" = free tier; ganti ke "standard" untuk production
    plan: starter

    ## Health check — Render tunggu sampai endpoint ini return 200
    healthCheckPath: /api/health

    ## Auto-deploy setiap push ke branch ini
    branch: main
    autoDeploy: true

    ## Pre-deploy command: jalankan Prisma migrate sebelum container baru live
    ## Render menjalankan ini di container lama sebelum swap traffic.
    preDeployCommand: npx prisma migrate deploy

    ## Environment variables
    ## Secrets (nilai sensitif) diisi manual di Render Dashboard > Environment
    ## atau via Render CLI.  Di sini hanya non-secret / defaults.
    envVars:
      ## ── Port — Render inject ini otomatis, tapi kita eksplisitkan ────────
      ## Render default port untuk Docker web service adalah 10000.
      ## main.ts baca process.env.PORT, jadi WAJIB match dengan port yg dipakai.
      - key: PORT
        value: "10000"

      ## ── App config ──────────────────────────────────────────────────────
      - key: NODE_ENV
        value: production

      - key: JWT_EXPIRES_IN
        value: 1h

      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d

      ## Ganti dengan domain frontend production + Vercel preview URLs
      - key: CORS_ORIGINS
        value: "http://localhost:3000,https://*.vercel.app,https://menopos.vercel.app"

      - key: WEB_ORIGIN
        value: "https://menopos.vercel.app"

      ## ── Xendit config ───────────────────────────────────────────────────
      - key: XENDIT_API_BASE
        value: "https://api.xendit.co"

      - key: XENDIT_INVOICE_DURATION
        value: "900"

      - key: XENDIT_QR_DURATION
        value: "900"

      - key: XENDIT_VA_DURATION
        value: "86400"

      ## Set ke false di production setelah testing selesai
      - key: XENDIT_DEV_AUTO_SUCCESS
        value: "false"

      - key: XENDIT_DEV_AUTO_SUCCESS_DELAY_MS
        value: "2000"

      - key: XENDIT_CALLBACK_SUCCESS_URL
        value: "https://menopos.vercel.app/payment/success"

      - key: XENDIT_CALLBACK_FAILURE_URL
        value: "https://menopos.vercel.app/payment/failure"

      ## ── WhatsApp service ─────────────────────────────────────────────────
      ## URL wa-service eksternal (masih di Cloud Run)
      - key: WA_SERVICE_URL
        value: "https://wa-service-1018591685581.asia-southeast2.run.app"

      ## URL public backend ini sendiri — wa-service POST webhook ke sini.
      - key: WA_SERVICE_WEBHOOK_BASE
        value: "https://minipos-backend.onrender.com"

      ## ── Secrets — isi nilainya di Render Dashboard, JANGAN hardcode ──────
      ## Format: sync: false → Render tidak akan inject dari Blueprint,
      ## harus diisi manual agar tidak ter-commit ke Git.
      - key: DATABASE_URL
        sync: false # Connection pool URL (misalnya Supabase/Neon pooler)

      - key: DIRECT_URL
        sync: false # Direct URL ke database (untuk migrate)

      - key: JWT_SECRET
        sync: false

      - key: CLOUDINARY_URL
        sync: false

      - key: RESEND_API_KEY
        sync: false

      - key: PUSHER_APP_ID
        sync: false

      - key: PUSHER_KEY
        sync: false

      - key: PUSHER_SECRET
        sync: false

      - key: PUSHER_CLUSTER
        sync: false

      - key: XENDIT_SECRET_KEY
        sync: false

      - key: XENDIT_WEBHOOK_TOKEN
        sync: false

      - key: GROQ_API_KEY
        sync: false

      - key: REDIS_URL
        sync: false

      - key: GEMINI_API_KEY
        sync: false

      - key: SENTRY_DSN
        sync: false

      ## ── Search-by-Image (pgvector + ai-service) ─────────────────────────
      ## URL internal ai-service (private service di bawah). Render menyediakan
      ## hostname internal `<nama-service>:<port>` untuk komunikasi antar
      ## service dalam satu akun/region.
      - key: AI_SERVICE_URL
        value: "http://minipos-ai-service:8000"

      ## WAJIB diisi manual & HARUS sama dengan AI_SERVICE_TOKEN di ai-service.
      ## Tanpa ini endpoint /embed bisa dipanggil siapa pun yang bisa mencapai
      ## service tersebut.
      - key: AI_SERVICE_TOKEN
        sync: false

      ## Model image encoder. HARUS sama dengan yang di-bake ke image
      ## ai-service, karena vektor dari model berbeda tidak sebanding.
      - key: AI_MODEL_NAME
        value: "google/siglip-base-patch16-224"

      ## Dimensi vektor. HARUS sama dengan kolom products.embedding
      ## (vector(768), lihat prisma/migrations/manual/phase58_image_embedding.sql)
      ## dan dengan /health.dim ai-service. SigLIP base = 768.
      - key: VECTOR_DIMENSION
        value: "768"

      - key: IMAGE_SEARCH_LIMIT
        value: "12"

      ## Gate hasil pencarian. UTAMANYA RELATIF: hit diterima kalau jaraknya
      ## jauh lebih kecil dari sebaran jarak query itu sendiri —
      ##   ratio = distance / median(jarak query ke SELURUH katalog company)
      ## Ambang absolut tunggal TIDAK BISA dipakai: foto baru dari kamera untuk
      ## produk yang benar mendarat di 0.21–0.30 sementara p01 jarak antar
      ## produk katalog = 0.2489 (sebarannya tumpang tindih).
      ## Kalibrasi 68 produk + 8 foto produk company lain:
      ##   ada di katalog -> ratio 0.185 & 0.466 | tidak ada -> 0.732..0.876
      - key: IMAGE_SEARCH_RATIO_MAX
        value: "0.60"

      ## Plafon absolut: jarak di atas ini tidak pernah diterima.
      - key: IMAGE_SEARCH_ABS_MAX
        value: "0.45"

      ## Lantai absolut: jarak di bawah ini selalu diterima (p90 self-distance
      ## foto terdistorsi = 0.14).
      - key: IMAGE_SEARCH_ABS_FLOOR
        value: "0.18"

      ## Kandidat "Gambar serupa" saat TIDAK ADA hasil yang lolos gate. Gate
      ## dikalibrasi untuk kecocokan PRODUK, jadi foto kategori (mis. botol air
      ## mineral generik tanpa label vs katalog yang hanya punya "Aqua Gelas")
      ## pasti gagal gate. Tanpa tier ini user melihat layar buntu padahal
      ## tetangga terdekatnya relevan. Hasilnya HANYA mengisi section "Gambar
      ## serupa", tidak pernah diklaim persis. 0 = matikan (perilaku lama).
      - key: IMAGE_SEARCH_NEAR_LIMIT
        value: "6"

      ## Jalur TEKS: deskripsi yang dibaca LLM vision dari foto dicocokkan ke
      ## FOTO produk lewat text tower SigLIP (ruang vektor yang sama).
      ## Kasus nyata "foto botol air mineral tanpa label" vs katalog yang hanya
      ## punya "aqua gelas":
      ##   gambar->gambar : peringkat 40/69 (d=0.4366) - tidak ketemu
      ##   nama produk    : skor 0.031 (ambang 0.30)   - tidak ketemu
      ##   teks->gambar   : peringkat 1/69 (d=0.9284)  - KETEMU
      ## SKALA JARAK BEDA dari gambar<->gambar. Kalibrasi 13 positif + 9 negatif:
      ##   ada padanannya -> 0.8596..0.9284 | tidak ada -> 0.9605..1.0081
      ## 0.945 = titik tengahnya.
      - key: IMAGE_SEARCH_TEXT_ABS_MAX
        value: "0.945"

      - key: IMAGE_SEARCH_TEXT_LIMIT
        value: "6"

      - key: IMAGE_MAX_SIZE_MB
        value: "5"

      ## Timeout HTTP ke ai-service. Cold start container model bisa lambat.
      - key: AI_SERVICE_TIMEOUT_MS
        value: "20000"

  ## ── ai-service: embedding gambar (FastAPI + SigLIP, CPU) ────────────────
  ## type: pserv = PRIVATE service. TIDAK punya URL publik, hanya bisa diakses
  ## dari service lain di akun Render yang sama. Ini yang menjaga /embed tidak
  ## terbuka ke internet; AI_SERVICE_TOKEN adalah lapisan kedua.
  - type: pserv
    name: minipos-ai-service
    runtime: docker
    ## Path relatif terhadap root repo backend. Karena ai-service sekarang di root,
    ## kita pakai parent dir agar tetap bisa dibangun dari folder backend.
    dockerfilePath: ../ai-service/Dockerfile
    dockerContext: ../ai-service

    ## PERHATIAN RAM: torch CPU + SigLIP base fp32 butuh ~1.2-1.6GB saat
    ## inference. Plan "starter" TIDAK cukup — container akan OOM saat memuat
    ## model. Verifikasi kuota RAM plan di dashboard Render sebelum deploy dan
    ## naikkan bila perlu.
    plan: standard

    branch: main
    autoDeploy: true

    ## healthCheckPath tidak berlaku untuk private service (khusus type: web).
    ## Kesiapan dipantau lewat GET /health dari backend (endpoint
    ## /api/image-search/status mengembalikan serviceReachable).

    envVars:
      - key: AI_MODEL_NAME
        value: "google/siglip-base-patch16-224"

      ## Harus identik dengan AI_SERVICE_TOKEN di menopos-api.
      - key: AI_SERVICE_TOKEN
        sync: false

      - key: AI_MAX_BATCH
        value: "32"

      - key: IMAGE_MAX_SIZE_MB
        value: "5"

      ## Cache HF sudah di-bake ke image; set eksplisit supaya runtime tidak
      ## mencoba menulis ke direktori lain.
      - key: HF_HOME
        value: "/opt/hf"

